<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Font Folder — Professional Demo</title>
<style>
  :root{
    --bg1: #fffaf0;
    --bg2: #f7fbff;
    --card:#ffffff;
    --accent1:#ff6b6b;
    --accent2:#4fbbe9;
    --accent3:#ffd36b;
    --muted:#6b7280;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background: linear-gradient(135deg,var(--bg2), var(--bg1));
    padding:20px;
    color:#0f172a;
  }
  header{text-align:center;margin-bottom:10px}
  h1{margin:0;color:var(--accent1);font-size:36px}
  p.lead{margin:6px 0 18px;color:var(--muted);max-width:900px;margin-left:auto;margin-right:auto;font-size:16px}

  /* editor + actions */
  .editor {
    width:100%;
    max-width:1100px;
    margin:0 auto 18px;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  #articleInput{
    flex:1;
    min-width:220px;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid rgba(2,6,23,0.06);
    font-size:16px;
    box-shadow: 0 8px 22px rgba(11,22,65,0.04);
  }
  .actions{ display:flex; gap:10px; align-items:center }
  .btn{
    background: linear-gradient(180deg,var(--accent3), #f1c04a);
    border:none;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 20px rgba(250,174,56,0.12)
  }
  .btn.secondary{
    background: linear-gradient(180deg,#e7eefc,#d3ecff); color:#08324a;
  }

  /* search */
  .search-box{ position:relative; width:360px; max-width:90%; margin:0 auto 18px; }
  .search-box input{
    width:100%;
    padding:12px 52px 12px 16px;
    border-radius:26px;border:1px solid rgba(2,6,23,0.06);font-size:15px;
    box-shadow: 0 10px 24px rgba(15,23,42,0.03);
  }
  .search-box button{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--accent2), #3aa9d9);
    color:white;font-size:18px;cursor:pointer;box-shadow:0 8px 20px rgba(77,157,184,0.18)
  }

  /* grid */
  .font-grid{
    width:100%;
    max-width:1200px;
    margin:10px auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:18px;
    align-items:start;
  }
  .font-card{
    background:var(--card); border-radius:14px; padding:20px; text-align:center;
    box-shadow: 0 10px 24px rgba(15,23,42,0.06); cursor:pointer; transition:transform .18s, box-shadow .18s, border .18s;
    border:2px solid transparent;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .font-card:hover{ transform:translateY(-6px) scale(1.02); box-shadow:0 18px 40px rgba(15,23,42,0.1) }
  .font-card.selected{ border-color:rgba(99,102,241,0.18); box-shadow:0 18px 44px rgba(99,102,241,0.08) }

  .font-preview{
    font-size:28px; 
    margin-bottom:10px; 
    color:var(--accent1); 
    min-height:56px; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    padding:6px 2px; 
    text-align:center;
  }
  .font-name{ font-weight:700; color:var(--accent2); letter-spacing:.6px }

  /* responsive */
  @media (max-width:900px){ .font-grid{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)) } }
  @media (max-width:520px){ .font-grid{ grid-template-columns:1fr } .editor{width:100%} .search-box{ width:92% } }
</style>
</head>
<body>

<header>
  <h1>Font Folder</h1>
  <p class="lead">Preview 20+ stylish fonts. Each shows "BUSTAMI AaBbCc". Copy styled text for social apps.</p>
</header>

<!-- Editor (top) -->
<div class="editor">
  <input id="articleInput" type="text" placeholder="Type your text here" value="BUSTAMI AaBbCc">
  <div class="actions">
    <button id="copyStyled" class="btn" title="Copy styled text">Copy Styled Text</button>
    <button id="copyPlain" class="btn secondary" title="Copy plain text">Copy Plain</button>
  </div>
</div>

<!-- Search -->
<div class="search-box" aria-label="Search fonts">
  <input id="searchInput" type="text" placeholder="Search font">
  <button id="searchBtn" title="Search">🔍</button>
</div>

<!-- FONT GRID -->
<div class="font-grid" id="fontGrid"></div>

<footer style="text-align:center;color:var(--muted);margin-top:18px">© Font Folder Demo</footer>

<script>
/* ---------- Font list ---------- */
const fonts = [
  "Arial","Verdana","Tahoma","Trebuchet MS","Impact","Georgia","Courier New","Lucida Console",
  "Roboto","Montserrat","Open Sans","Lato","Ubuntu","BUSTAMI","Comic Sans MS","Franklin Gothic Medium",
  "Palatino Linotype","Garamond","Bookman","Candara","Century Gothic","Arial Black","Brush Script MT",
  "Futura","Gill Sans","Optima","Didot","Rockwell","Times New Roman","Calibri","Cambria","Constantia",
  "Segoe UI","Consolas","Courier","Monaco","PT Sans","Merriweather","Source Sans Pro","Oswald","Raleway"
];

/* ---------- UI Logic ---------- */
const fontGrid = document.getElementById('fontGrid');
const articleInput = document.getElementById('articleInput');
const copyStyledBtn = document.getElementById('copyStyled');
const copyPlainBtn = document.getElementById('copyPlain');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');

let selectedCard = null;

function createFontCard(fontName){
  const card = document.createElement('div');
  card.className = 'font-card';
  card.dataset.name = fontName;

  const preview = document.createElement('div');
  preview.className = 'font-preview';
  preview.textContent = 'BUSTAMI AaBbCc';
  preview.style.fontFamily = fontName;

  const name = document.createElement('div');
  name.className = 'font-name';
  name.textContent = fontName;

  card.appendChild(preview);
  card.appendChild(name);

  card.addEventListener('click', ()=>{
    if(selectedCard) selectedCard.classList.remove('selected');
    selectedCard = card;
    card.classList.add('selected');
  });

  return card;
}

// populate grid
fonts.forEach(f=>{
  fontGrid.appendChild(createFontCard(f));
});

// copy buttons
copyStyledBtn.addEventListener('click', async ()=>{
  if(!selectedCard){ alert('Please select a font first'); return; }
  const text = articleInput.value || 'BUSTAMI AaBbCc';
  try{ await navigator.clipboard.writeText(text); alert('Styled text copied ✅'); } 
  catch(e){ alert('Copy failed'); console.error(e); }
});

copyPlainBtn.addEventListener('click', async ()=>{
  const text = articleInput.value || 'BUSTAMI AaBbCc';
  try{ await navigator.clipboard.writeText(text); alert('Plain text copied ✅'); } 
  catch(e){ alert('Copy failed'); console.error(e); }
});

// search
searchBtn.addEventListener('click',()=>{
  const q = (searchInput.value||'').toLowerCase();
  fontGrid.querySelectorAll('.font-card').forEach(c=>{
    c.style.display = c.dataset.name.toLowerCase().includes(q)?'flex':'none';
  });
});
searchInput.addEventListener('keypress', e=>{if(e.key==='Enter') searchBtn.click()});
</script>

</body>
</html>
