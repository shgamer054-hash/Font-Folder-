<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Folder Pro - Unicode Edition (Fixed)</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #111, #222);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    p {
      color: #ccc;
      font-size: 14px;
    }
    .input-area {
      margin: 20px auto;
      max-width: 400px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }
    .font-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .font-card {
      background: #fff;
      color: #000;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 22px;
      font-weight: bold;
      word-break: break-word;
    }
    .font-card:hover {
      background: #000;
      color: #fff;
      transform: scale(1.05);
    }
    .toast {
      position: fixed;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #00ff99;
      color: #000;
      padding: 10px 25px;
      border-radius: 25px;
      font-weight: bold;
      opacity: 0;
      transition: all 0.5s ease;
    }
    .toast.show {
      bottom: 30px;
      opacity: 1;
    }
    .preview {
      background: #fff;
      color: #000;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      display: inline-block;
      font-size: 24px;
      font-weight: bold;
      min-width: 180px;
    }
  </style>
</head>
<body>
  <h1>FONT FOLDER PRO</h1>
  <p>Type your text below and click a font to copy your styled text</p>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your text here..." oninput="renderFonts()" />
  </div>

  <div class="preview" id="previewText">BUSTAMI</div>

  <div class="font-grid" id="fontGrid"></div>

  <div id="toast" class="toast">Copied!</div>

  <script>
    const fonts = [
      "ＢＵＳＴＡＭＩ",
      "🅱🆄🆂🆃🅰🅼🅸",
      "𝓑𝓤𝓢𝓣𝓐𝓜𝓘",
      "𝔅𝔘𝔖𝔗𝔄𝔐𝔌",
      "ʙᴜsᴛᴀᴍɪ",
      "ʙⓤsⓣᗩᗰɪ",
      "🅑🅤🅢🅣🅐🅜🅘",
      "𝗕𝗨𝗦𝗧𝗔𝗠𝗜",
      "𝑩𝑼𝑺𝑻𝑨𝑴𝑰",
      "𝘉𝘜𝘚𝘛𝘈𝘔𝘐",
      "𝙱𝚄𝚂𝚃𝙰𝙼𝙸",
      "🄱🅄🅂🅃🄰🄼🄸",
      "🅑🅤🅢🅣🅐🅜🅘",
      "Ｂｕｓｔａｍｉ",
      "Ⓑⓤⓢⓣⓐⓜⓘ",
      "Ｂ🆄ＳＴ🅰🅼Ｉ",
      "🅱ust🅰m🅸",
      "𝓑𝓾𝓼𝓽𝓪𝓶𝓲",
      "ＢＵＳＴＡＭＩ⚡",
      "🅑🅤🅢🅣🅐🅜🅘🔥"
    ];

    const grid = document.getElementById("fontGrid");
    const preview = document.getElementById("previewText");
    const toast = document.getElementById("toast");
    const input = document.getElementById("userInput");

    // 🔧 Function to render fonts properly with user's input
    function renderFonts() {
      const text = input.value.trim() || "BUSTAMI";
      preview.innerText = text;
      grid.innerHTML = "";

      fonts.forEach((f) => {
        // প্রতিটি ফন্টে "BUSTAMI" অংশটাকে ইউজারের ইনপুটে রিপ্লেস করা হবে
        const customText = f.replace(/BUSTAMI/gi, text);
        const div = document.createElement("div");
        div.className = "font-card";
        div.innerText = customText;
        div.onclick = () => copyFont(customText); // এখন সঠিক টেক্সট কপি হবে
        grid.appendChild(div);
      });
    }

    // 🔧 কপি ফাংশন
    function copyFont(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      });
    }

    // 🔧 টোস্ট মেসেজ দেখানো
    function showToast() {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }

    // প্রথমবার লোড হলে ডিফল্ট রেন্ডার
    renderFonts();
  </script>
</body>
</html>
