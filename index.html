<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Folder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 40px;
    }
    .font-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .font-card {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      width: 250px;
      text-align: left;
    }
    .font-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    .font-card p {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Font Folder</h1>
    <div class="font-list" id="fontList">
      <!-- Fonts will be added here by JS -->
    </div>
  </div>

  <script>
    const fonts = [
      { name: "Roboto", sample: "The quick brown fox jumps over the lazy dog." },
      { name: "Montserrat", sample: "The quick brown fox jumps over the lazy dog." },
      { name: "BUSTAMI", sample: "The quick brown fox jumps over the lazy dog." },
      { name: "Open Sans", sample: "The quick brown fox jumps over the lazy dog." },
      { name: "Lato", sample: "The quick brown fox jumps over the lazy dog." }
    ];

    const fontList = document.getElementById("fontList");

    fonts.forEach(font => {
      const card = document.createElement("div");
      card.className = "font-card";

      const title = document.createElement("h2");
      title.textContent = font.name;

      const sample = document.createElement("p");
      sample.textContent = font.sample;
      sample.style.fontFamily = font.name;

      card.appendChild(title);
      card.appendChild(sample);

      fontList.appendChild(card);
    });
  </script>
</body>
</html>
